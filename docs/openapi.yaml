openapi: "3.1.0"
info:
  title: "Osiris Harness local API"
  version: "3.0.0"
  description: |-
    Authenticate before reading or writing API resources; the loopback browser pages remain public. Viewers read only public projects and cannot write. Members write their own projects or those granting member access; only an owner/admin managing their own project may delete project resources or manage explicit members. Sessions without a project and all their descendants are private to the individual who created the session. That person may read, write and delete them without owning a project. An admin has no global cross-tenant override. Counts, nested routes and linked actions are scoped to the same identity. An invisible or missing object returns 404; insufficient access to a visible object returns 403. Ownership and parent relationships cannot be transferred through PATCH.

    All request entities are UTF-8 objects, max 65,536 bytes, max depth 32. Send Content-Type with a body; Accept independently selects the response. JSON, XML and YAML represent the same typed data. Missing Accept or */* prefers JSON. text/xml and text/yaml are aliases for the canonical application types. Malformed documents/duplicate fields: 400; too large: 413; unsupported encoding or media type: 415; well-formed but invalid fields: 422. Unsupported Accept returns 406 with JSON. DELETE successes and logout return 204 with no entity.

    XML input uses <request kind="object"> with named field children; output uses <response kind="object|array">. Nested objects/arrays have kind="object|array"; array entries use <item>. Strings use character data, other scalars use type="integer|number|boolean", null uses xsi:nil="true" in the XML Schema Instance namespace. YAML is a single data mapping on input; do not use aliases or custom tags.

    Every API response carries X-Request-Id; structured errors repeat it in requestId. Invalid routes return 404 and unsupported methods on known routes return 405 with Allow. Rate-limited writes can return 429. Changes of state require the session cookie plus X-CSRF-Token, except for login and registration. Cross-site writes are rejected. An authorized request must satisfy the current database state regardless of any previously advertised action.
servers:
  -
    url: "http://127.0.0.1:8080"
security:
  -
    sessionCookie: []
paths:
  /api:
    get:
      operationId: discover
      description: "Authenticated entry point. Non-viewers receive createSession (POST /sessions), even when they have no projects. Credential and creation links are role-sensitive."
      responses:
        "200": {$ref: "#/components/responses/Discovery"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "406": {$ref: "#/components/responses/NotAcceptable"}
        "500": {$ref: "#/components/responses/Error"}
  /auth/register:
    post:
      operationId: register
      description: "Create a local member and sign in. GET /register serves the public browser form. No session or CSRF token is required; cross-origin requests are rejected (403). User IDs are server-assigned. A username already held by any account, even a disabled one, returns 409 without changing that account. The per-IP limit is 20 attempts per 15 minutes; 429 includes Retry-After in seconds."
      security: []
      requestBody: {$ref: "#/components/requestBodies/RegisterInput"}
      responses:
        "201": {$ref: "#/components/responses/Registered"}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "406": {$ref: "#/components/responses/NotAcceptable"}
        "409": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "415": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/Error"}
  /auth/login:
    post:
      operationId: login
      description: "Authenticate with local credentials. Sets osiris_session, a host-only HttpOnly SameSite=Strict cookie (Secure with HTTPS). No CSRF token is needed to log in."
      security: []
      requestBody: {$ref: "#/components/requestBodies/LoginInput"}
      responses:
        "200": {$ref: "#/components/responses/Auth"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "406": {$ref: "#/components/responses/NotAcceptable"}
        "413": {$ref: "#/components/responses/Error"}
        "415": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/Error"}
  /auth/me:
    get:
      operationId: currentUser
      description: "Return the current identity and its CSRF token."
      responses:
        "200": {$ref: "#/components/responses/Auth"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "406": {$ref: "#/components/responses/NotAcceptable"}
        "500": {$ref: "#/components/responses/Error"}
  /auth/logout:
    post:
      operationId: logout
      description: "Revoke the session and clear the cookie. No request body."
      security: [{sessionCookie: [], csrfHeader: []}]
      responses:
        "204": {$ref: "#/components/responses/NoContent"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "406": {$ref: "#/components/responses/NotAcceptable"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/Error"}
  /api/runtime:
    get:
      operationId: getRuntime
      description: "List account-specific provider configuration and capabilities without performing an upstream request."
      responses:
        "200": {$ref: "#/components/responses/Runtime"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "406": {$ref: "#/components/responses/NotAcceptable"}
        "500": {$ref: "#/components/responses/Error"}
  /api/models:
    get:
      operationId: listAvailableModels
      description: "Enumerate model identifiers from this account’s configured providers. Status is per provider; catalog reads do not perform inference or consume the chat budget."
      responses:
        "200": {$ref: "#/components/responses/ModelCatalog"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "406": {$ref: "#/components/responses/NotAcceptable"}
        "500": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /api/maintenance/prune:
    post:
      operationId: pruneExpiredAuthRecords
      description: "Admin only; advertised as /api _links.prune. Remove expired authentication sessions and rate-limit windows, and audit events older than 30 days. No query, request body, affected identities or counts."
      security: [{sessionCookie: [], csrfHeader: []}]
      responses:
        "204": {$ref: "#/components/responses/NoContent"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "406": {$ref: "#/components/responses/NotAcceptable"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/Error"}
  /api/budget:
    get:
      operationId: getBudget
      description: "Read your own daily dispatch budget; no project selection or client-supplied actor."
      responses:
        "200": {$ref: "#/components/responses/Budget"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "406": {$ref: "#/components/responses/NotAcceptable"}
        "500": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /api/credentials/{provider}:
    parameters: [{$ref: "#/components/parameters/provider"}]
    put:
      operationId: setProviderCredential
      description: "Store or replace your own encrypted cloud credential. No viewer writes; never echoes the key."
      security: [{sessionCookie: [], csrfHeader: []}]
      requestBody: {$ref: "#/components/requestBodies/CredentialInput"}
      responses:
        "200": {$ref: "#/components/responses/CredentialStatus"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "406": {$ref: "#/components/responses/NotAcceptable"}
        "413": {$ref: "#/components/responses/Error"}
        "415": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
    delete:
      operationId: deleteProviderCredential
      description: "Remove your own cloud credential."
      security: [{sessionCookie: [], csrfHeader: []}]
      responses:
        "204": {$ref: "#/components/responses/NoContent"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "406": {$ref: "#/components/responses/NotAcceptable"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/Error"}
  /projects:
    get:
      operationId: listProjects
      description: "List only projects visible to this account; userId is a filter, not authorization."
      parameters:
        - {$ref: "#/components/parameters/limit"}
        - {$ref: "#/components/parameters/offset"}
        -
          name: sort
          in: query
          required: false
          schema: {type: string, enum: [createdAt, updatedAt, id, name]}
        - {$ref: "#/components/parameters/order"}
        - {$ref: "#/components/parameters/q"}
        - {$ref: "#/components/parameters/view"}
        - {name: userId, in: query, required: false, schema: {type: string, minLength: 1}}
        - {name: language, in: query, required: false, schema: {type: string}}
      responses:
        "200": {$ref: "#/components/responses/ProjectPage"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "406": {$ref: "#/components/responses/NotAcceptable"}
        "500": {$ref: "#/components/responses/Error"}
    post:
      operationId: createProject
      description: "Creates a project owned by the authenticated actor. Never accepts a client-controlled userId."
      security: [{sessionCookie: [], csrfHeader: []}]
      requestBody: {$ref: "#/components/requestBodies/CreateProject"}
      responses:
        "201": {$ref: "#/components/responses/ProjectCreated"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "406": {$ref: "#/components/responses/NotAcceptable"}
        "409": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "415": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/Error"}
  /projects/{projectId}:
    parameters: [{$ref: "#/components/parameters/projectId"}]
    get:
      operationId: getProject
      description: "Read a visible project."
      parameters: [{$ref: "#/components/parameters/view"}]
      responses:
        "200": {$ref: "#/components/responses/ProjectItem"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "406": {$ref: "#/components/responses/NotAcceptable"}
        "500": {$ref: "#/components/responses/Error"}
    patch:
      operationId: patchProject
      description: "Edit a writable project; changing visibility requires project management permission. Ownership is immutable."
      security: [{sessionCookie: [], csrfHeader: []}]
      requestBody: {$ref: "#/components/requestBodies/UpdateProject"}
      responses:
        "200": {$ref: "#/components/responses/ProjectDetail"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "406": {$ref: "#/components/responses/NotAcceptable"}
        "409": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "415": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/Error"}
    delete:
      operationId: deleteProject
      description: "Manage permission required. Projects with dependent sessions are not deleted."
      security: [{sessionCookie: [], csrfHeader: []}]
      responses:
        "204": {$ref: "#/components/responses/NoContent"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "406": {$ref: "#/components/responses/NotAcceptable"}
        "409": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/Error"}
  /projects/{projectId}/members:
    parameters: [{$ref: "#/components/parameters/projectId"}]
    get:
      operationId: listMembers
      description: "List explicit members. Restricted to the managing project account."
      responses:
        "200": {$ref: "#/components/responses/Members"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "406": {$ref: "#/components/responses/NotAcceptable"}
        "500": {$ref: "#/components/responses/Error"}
    post:
      operationId: setMember
      description: "Add or update project-local access for an existing account; cannot transfer ownership or assign admin."
      security: [{sessionCookie: [], csrfHeader: []}]
      requestBody: {$ref: "#/components/requestBodies/SetMember"}
      responses:
        "200": {$ref: "#/components/responses/Member"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "406": {$ref: "#/components/responses/NotAcceptable"}
        "409": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "415": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/Error"}
  /projects/{projectId}/members/{userId}:
    parameters: [{$ref: "#/components/parameters/projectId"}, {$ref: "#/components/parameters/userId"}]
    delete:
      operationId: deleteMember
      description: "Remove this explicit membership; leaves ownership and user record unchanged."
      security: [{sessionCookie: [], csrfHeader: []}]
      responses:
        "204": {$ref: "#/components/responses/NoContent"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "406": {$ref: "#/components/responses/NotAcceptable"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/Error"}
  /projects/{projectId}/sessions:
    parameters: [{$ref: "#/components/parameters/projectId"}]
    get:
      operationId: listProjectSessions
      description: "Page sessions in a visible project."
      parameters:
        - {$ref: "#/components/parameters/limit"}
        - {$ref: "#/components/parameters/offset"}
        -
          name: sort
          in: query
          required: false
          schema: {type: string, enum: [createdAt, updatedAt, id, title, status]}
        - {$ref: "#/components/parameters/order"}
        - {$ref: "#/components/parameters/q"}
        - {$ref: "#/components/parameters/view"}
        - {$ref: "#/components/parameters/include"}
        - {name: projectId, in: query, required: false, schema: {type: string, minLength: 1}}
        -
          name: status
          in: query
          required: false
          schema: {type: string, enum: [active, completed, archived]}
      responses:
        "200": {$ref: "#/components/responses/SessionPage"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "406": {$ref: "#/components/responses/NotAcceptable"}
        "500": {$ref: "#/components/responses/Error"}
    post:
      operationId: createProjectSession
      description: "Create a session under this project. The parent is fixed by the URI."
      security: [{sessionCookie: [], csrfHeader: []}]
      requestBody: {$ref: "#/components/requestBodies/CreateNestedSession"}
      responses:
        "201": {$ref: "#/components/responses/SessionCreated"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "406": {$ref: "#/components/responses/NotAcceptable"}
        "409": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "415": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/Error"}
  /sessions:
    get:
      operationId: listSessions
      description: "Includes the actor's private sessions and sessions in visible projects. No query parameters: original unbounded, ordered plain array. Any supported collection control selects the paginated representation, with a create link to POST /sessions for non-viewers. Filtering by projectId returns only sessions in that project."
      parameters:
        - {$ref: "#/components/parameters/limit"}
        - {$ref: "#/components/parameters/offset"}
        -
          name: sort
          in: query
          required: false
          schema: {type: string, enum: [createdAt, updatedAt, id, title, status]}
        - {$ref: "#/components/parameters/order"}
        - {$ref: "#/components/parameters/q"}
        - {$ref: "#/components/parameters/view"}
        - {$ref: "#/components/parameters/include"}
        - {name: projectId, in: query, required: false, schema: {type: string, minLength: 1}}
        -
          name: status
          in: query
          required: false
          schema: {type: string, enum: [active, completed, archived]}
      responses:
        "200": {$ref: "#/components/responses/SessionsResult"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "406": {$ref: "#/components/responses/NotAcceptable"}
        "500": {$ref: "#/components/responses/Error"}
    post:
      operationId: createSession
      description: "Non-viewers can create a private session by sending a title and omitting projectId or setting it to null. No project is created. A non-null projectId attaches the session to that project and requires write access there."
      security: [{sessionCookie: [], csrfHeader: []}]
      requestBody: {$ref: "#/components/requestBodies/CreateSession"}
      responses:
        "201": {$ref: "#/components/responses/SessionCreated"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "406": {$ref: "#/components/responses/NotAcceptable"}
        "409": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "415": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/Error"}
  /sessions/{sessionId}:
    parameters: [{$ref: "#/components/parameters/sessionId"}]
    get:
      operationId: getSession
      description: "Read a visible session and optionally compose project, messages and tasks. Full and summary representations always include projectId. Without a project, projectId is null, _links.project is absent, and include=project returns project: null."
      parameters: [{$ref: "#/components/parameters/view"}, {$ref: "#/components/parameters/include"}]
      responses:
        "200": {$ref: "#/components/responses/SessionItem"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "406": {$ref: "#/components/responses/NotAcceptable"}
        "500": {$ref: "#/components/responses/Error"}
    patch:
      operationId: patchSession
      description: "Update the title or lifecycle of a writable session. Reparenting is not permitted."
      security: [{sessionCookie: [], csrfHeader: []}]
      requestBody: {$ref: "#/components/requestBodies/UpdateSession"}
      responses:
        "200": {$ref: "#/components/responses/SessionDetail"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "406": {$ref: "#/components/responses/NotAcceptable"}
        "409": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "415": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/Error"}
    delete:
      operationId: deleteSession
      description: "Delete an authorized session; deleteContents=1 deletes its descendants transactionally."
      security: [{sessionCookie: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/deleteContents"}]
      responses:
        "204": {$ref: "#/components/responses/NoContent"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "406": {$ref: "#/components/responses/NotAcceptable"}
        "409": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/Error"}
  /sessions/{sessionId}/messages:
    parameters: [{$ref: "#/components/parameters/sessionId"}]
    get:
      operationId: listMessages
      description: "Page immutable conversation turns."
      parameters:
        - {$ref: "#/components/parameters/limit"}
        - {$ref: "#/components/parameters/offset"}
        - {name: sort, in: query, required: false, schema: {type: string, enum: [createdAt, id]}}
        - {$ref: "#/components/parameters/order"}
        - {$ref: "#/components/parameters/q"}
        - {$ref: "#/components/parameters/view"}
        -
          name: role
          in: query
          required: false
          schema: {type: string, enum: [user, assistant, system, tool]}
        - {name: sessionId, in: query, required: false, schema: {type: string, minLength: 1}}
      responses:
        "200": {$ref: "#/components/responses/MessagePage"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "406": {$ref: "#/components/responses/NotAcceptable"}
        "500": {$ref: "#/components/responses/Error"}
    post:
      operationId: appendMessage
      description: "Append a message to this session."
      security: [{sessionCookie: [], csrfHeader: []}]
      requestBody: {$ref: "#/components/requestBodies/CreateMessage"}
      responses:
        "201": {$ref: "#/components/responses/MessageCreated"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "406": {$ref: "#/components/responses/NotAcceptable"}
        "409": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "415": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/Error"}
  /sessions/{sessionId}/messages/{messageId}:
    parameters: [{$ref: "#/components/parameters/sessionId"}, {$ref: "#/components/parameters/messageId"}]
    get:
      operationId: getMessage
      description: "Read a message in this session."
      parameters: [{$ref: "#/components/parameters/view"}]
      responses:
        "200": {$ref: "#/components/responses/MessageItem"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "406": {$ref: "#/components/responses/NotAcceptable"}
        "500": {$ref: "#/components/responses/Error"}
    delete:
      operationId: deleteMessage
      description: "Remove a message in this session."
      security: [{sessionCookie: [], csrfHeader: []}]
      responses:
        "204": {$ref: "#/components/responses/NoContent"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "406": {$ref: "#/components/responses/NotAcceptable"}
        "409": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/Error"}
  /sessions/{sessionId}/tasks:
    parameters: [{$ref: "#/components/parameters/sessionId"}]
    get:
      operationId: listTasks
      description: "Page tasks in this session."
      parameters:
        - {$ref: "#/components/parameters/limit"}
        - {$ref: "#/components/parameters/offset"}
        -
          name: sort
          in: query
          required: false
          schema: {type: string, enum: [createdAt, updatedAt, id, title, status]}
        - {$ref: "#/components/parameters/order"}
        - {$ref: "#/components/parameters/q"}
        - {$ref: "#/components/parameters/view"}
        -
          name: status
          in: query
          required: false
          schema: {type: string, enum: [pending, running, completed, failed]}
        - {name: sessionId, in: query, required: false, schema: {type: string, minLength: 1}}
      responses:
        "200": {$ref: "#/components/responses/TaskPage"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "406": {$ref: "#/components/responses/NotAcceptable"}
        "500": {$ref: "#/components/responses/Error"}
    post:
      operationId: createTask
      description: "New tasks start pending."
      security: [{sessionCookie: [], csrfHeader: []}]
      requestBody: {$ref: "#/components/requestBodies/CreateTask"}
      responses:
        "201": {$ref: "#/components/responses/TaskCreated"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
