openapi: 3.0.3
info:
  title: Osiris Build 1
  version: 1.0.0
  description: >-
    Local PHP API with two read operations. All persisted sessions are visible across
    owners. No authentication, filters, pagination, or writes are implemented.
    GET / serves an HTML page outside this API contract. Other methods on known
    routes return 405 with Allow: GET; unknown routes return 404.
servers:
  - url: http://127.0.0.1:8080
    description: Local populated database
  - url: http://127.0.0.1:8081
    description: Separate empty database started with -EmptyDemo -Port 8081
paths:
  /sessions:
    get:
      operationId: listSessions
      summary: List all sessions
      description: >-
        Returns a plain array ordered by created_at ascending, then id ascending.
        There are no query filters or ownership restrictions. Existing local rows
        are included, so a populated database need not have exactly five sessions.
      responses:
        '200':
          description: All sessions, or an empty array when no sessions exist.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
              examples:
                populated:
                  summary: The five canonical seed rows in SQL order
                  value:
                    - id: ses_103
                      projectId: prj_ai
                      title: Review error messages
                      status: archived
                      createdAt: '2026-10-09T09:00:00Z'
                      updatedAt: '2026-10-13T16:00:00Z'
                    - id: ses_101
                      projectId: prj_ai
                      title: Investigate crash
                      status: active
                      createdAt: '2026-10-10T14:00:00Z'
                      updatedAt: '2026-10-14T15:30:00Z'
                    - id: ses_202
                      projectId: prj_web
                      title: Test contact form
                      status: completed
                      createdAt: '2026-10-11T08:00:00Z'
                      updatedAt: '2026-10-13T10:00:00Z'
                    - id: ses_102
                      projectId: prj_ai
                      title: Add tests
                      status: completed
                      createdAt: '2026-10-11T10:00:00Z'
                      updatedAt: '2026-10-12T11:00:00Z'
                    - id: ses_201
                      projectId: prj_web
                      title: Fix navigation
                      status: active
                      createdAt: '2026-10-12T09:00:00Z'
                      updatedAt: '2026-10-14T12:00:00Z'
                empty:
                  summary: No sessions in the isolated empty database
                  value: []
        '500':
          $ref: '#/components/responses/ServerFailure'
  /sessions/{sessionId}:
    get:
      operationId: getSession
      summary: Get one session
      parameters:
        - name: sessionId
          in: path
          required: true
          description: Session ID, regardless of its project's owner.
          schema:
            type: string
            minLength: 1
          example: ses_101
      responses:
        '200':
          description: The persisted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              examples:
                existing:
                  summary: The canonical ses_101 row
                  value:
                    id: ses_101
                    projectId: prj_ai
                    title: Investigate crash
                    status: active
                    createdAt: '2026-10-10T14:00:00Z'
                    updatedAt: '2026-10-14T15:30:00Z'
        '404':
          description: No session has this ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  summary: GET /sessions/ses_missing
                  value:
                    error: Session not found
        '500':
          $ref: '#/components/responses/ServerFailure'
components:
  schemas:
    Session:
      type: object
      additionalProperties: false
      required:
        - id
        - projectId
        - title
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        projectId:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [active, completed, archived]
        createdAt:
          type: string
          format: date-time
          description: RFC 3339 in UTC with Z; fractional seconds are omitted when zero.
        updatedAt:
          type: string
          format: date-time
          description: RFC 3339 in UTC with Z; fractional seconds are omitted when zero.
    Error:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
  responses:
    ServerFailure:
      description: Database or server operation failed; diagnostics stay in the server log.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Database or server operation failed
