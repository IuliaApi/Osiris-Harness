        "409": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "415": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/Error"}
  /sessions/{sessionId}/tasks/{taskId}:
    parameters: [{$ref: "#/components/parameters/sessionId"}, {$ref: "#/components/parameters/taskId"}]
    get:
      operationId: getTask
      description: "Read current task state and version."
      parameters: [{$ref: "#/components/parameters/view"}]
      responses:
        "200": {$ref: "#/components/responses/TaskItem"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "406": {$ref: "#/components/responses/NotAcceptable"}
        "500": {$ref: "#/components/responses/Error"}
    patch:
      operationId: patchTask
      description: "Require the current version. Pending may start running; running may complete or fail; failed may return to pending, which clears its result. Only failed or completed tasks may hold a non-null result. A completed task cannot be edited."
      security: [{sessionCookie: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/ifMatch"}]
      requestBody: {$ref: "#/components/requestBodies/UpdateTask"}
      responses:
        "200": {$ref: "#/components/responses/TaskDetail"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "406": {$ref: "#/components/responses/NotAcceptable"}
        "409": {$ref: "#/components/responses/Error"}
        "412": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "415": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "428": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/RateLimited"}
