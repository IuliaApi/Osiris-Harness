        text/xml: {schema: {$ref: "#/components/schemas/TaskDetail"}}
        text/yaml: {schema: {$ref: "#/components/schemas/TaskDetail"}}
  schemas:
    Link:
      type: object
      required: [href, method]
      properties:
        href: {type: string, pattern: "^/(?!/)[^\\s\\\\]*$"}
        method: {type: string, enum: [GET, POST, PATCH, PUT, DELETE]}
      additionalProperties: false
    Error:
      type: object
      required: [error, code, requestId]
      properties:
        code: {type: string, minLength: 1, maxLength: 10000}
        error: {type: string, minLength: 1, maxLength: 10000}
        requestId: {type: string, pattern: "^[a-f0-9]{16}$"}
      additionalProperties: false
    Discovery:
      type: object
      required: [name, _links]
      properties:
        name: {const: Osiris}
        _links:
          allOf:
            - {$ref: "#/components/schemas/Links"}
            - {required: [self, me, projects, sessions, logout, runtime, budget]}
            - {properties: {createSession: {properties: {href: {const: "/sessions"}}}}}
    Identity:
      type: object
      required: [id, username, role]
      properties:
        id: {type: string, minLength: 1}
        username: {type: string}
        role: {type: string, enum: [viewer, member, owner, admin]}
      additionalProperties: false
    Auth:
      type: object
      required: [user, csrfToken]
      properties:
        user: {$ref: "#/components/schemas/Identity"}
        csrfToken: {type: string, pattern: "^[a-f0-9]{64}$"}
    LoginInput:
      type: object
      required: [username, password]
      properties:
        username: {type: string, minLength: 1, maxLength: 100, description: "Maximum 100 UTF-8 bytes."}
        password:
          type: string
          minLength: 1
          maxLength: 72
          description: "Maximum 72 UTF-8 bytes."
          writeOnly: true
      additionalProperties: false
    RegisterInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
          not: {pattern: "[^A-Za-z0-9_-]"}
          description: "Case-sensitive ASCII letters, digits, underscores or hyphens."
        password:
          type: string
          minLength: 3
          maxLength: 72
          not: {pattern: '\u0000'}
          description: "12–72 bytes after UTF-8 encoding; NUL is not allowed. Length in bytes can differ from the number of characters."
          writeOnly: true
      additionalProperties: false
    Page:
      type: object
      required: [total, offset, limit, hasMore]
      properties:
        total: {type: integer, minimum: 0}
        offset: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 100}
        hasMore: {type: boolean}
    PageLinks:
      type: object
      required: [self, next, previous]
      properties:
        self: {type: string, pattern: "^/(?!/)[^\\s\\\\]*$"}
        next: {type: [string, "null"], pattern: "^/(?!/)[^\\s\\\\]*$"}
        previous: {type: [string, "null"], pattern: "^/(?!/)[^\\s\\\\]*$"}
    Project:
      type: object
      required: [id, userId, name, language, repositoryUrl, visibility, createdAt, updatedAt]
      properties:
        id: {type: string, minLength: 1}
        userId: {type: string, minLength: 1}
        name: {type: string, minLength: 1, maxLength: 10000}
        language: {type: [string, "null"]}
        repositoryUrl: {type: [string, "null"]}
        visibility: {type: string, enum: [private, public]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    SessionProjectRelation:
      description: "Only sessions attached to a project link to it. When requested, the embedded project is null for a standalone session."
      if: {properties: {projectId: {type: "null"}}}
      then: {properties: {_links: {not: {required: [project]}}, project: {type: "null"}}}
      else: {properties: {_links: {required: [project]}, project: {$ref: "#/components/schemas/ProjectDetail"}}}
    Session:
      $ref: "#/components/schemas/SessionProjectRelation"
      type: object
      required: [id, projectId, title, status, createdAt, updatedAt]
      properties:
        id: {type: string, minLength: 1}
        projectId: {type: [string, "null"], minLength: 1}
        title: {type: string, minLength: 1, maxLength: 10000}
        status: {type: string, enum: [active, completed, archived]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Message:
      type: object
      required: [id, sessionId, role, content, createdAt]
      properties:
        id: {type: string, minLength: 1}
        sessionId: {type: string, minLength: 1}
        role: {type: string, enum: [user, assistant, system, tool]}
        content: {type: string, minLength: 1, maxLength: 10000}
        createdAt: {type: string, format: date-time}
        agentEvents: {type: array, items: {$ref: "#/components/schemas/AgentEvent"}}
    Task:
      type: object
      required: [id, sessionId, title, status, result, version, createdAt, updatedAt]
      properties:
        id: {type: string, minLength: 1}
        sessionId: {type: string, minLength: 1}
        title: {type: string, minLength: 1, maxLength: 10000}
        status: {type: string, enum: [pending, running, completed, failed]}
        result: {type: [string, "null"]}
        version: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ProjectItem:
      anyOf:
        -
          allOf:
            - {$ref: "#/components/schemas/Project"}
            -
              type: object
              required: [_links]
              properties: {_links: {allOf: [{$ref: "#/components/schemas/Links"}, {required: [self]}]}}
        -
          type: object
          required: [id, name, language, _links]
          properties:
            id: {type: string, minLength: 1}
            name: {type: string, minLength: 1, maxLength: 10000}
            language: {type: [string, "null"]}
            _links: {allOf: [{$ref: "#/components/schemas/Links"}, {required: [self]}]}
          additionalProperties: false
    MessageItem:
      anyOf:
        -
          allOf:
            - {$ref: "#/components/schemas/Message"}
            -
              type: object
              required: [_links]
              properties: {_links: {allOf: [{$ref: "#/components/schemas/Links"}, {required: [self]}]}}
        -
          type: object
          required: [id, role, createdAt, _links]
          properties:
            id: {type: string, minLength: 1}
            role: {type: string, enum: [user, assistant, system, tool]}
            createdAt: {type: string, format: date-time}
            _links: {allOf: [{$ref: "#/components/schemas/Links"}, {required: [self]}]}
          additionalProperties: false
    TaskItem:
      anyOf:
        -
          allOf:
            - {$ref: "#/components/schemas/Task"}
            -
              type: object
              required: [_links]
              properties: {_links: {allOf: [{$ref: "#/components/schemas/Links"}, {required: [self]}]}}
        -
          type: object
          required: [id, sessionId, title, status, createdAt, version, _links]
          properties:
            id: {type: string, minLength: 1}
            sessionId: {type: string, minLength: 1}
            title: {type: string, minLength: 1, maxLength: 10000}
            status: {type: string, enum: [pending, running, completed, failed]}
            createdAt: {type: string, format: date-time}
            version: {type: integer, minimum: 1}
            _links: {allOf: [{$ref: "#/components/schemas/Links"}, {required: [self]}]}
          additionalProperties: false
    LegacySession:
      allOf:
        - {$ref: "#/components/schemas/Session"}
        -
          type: object
          required: [_links]
          properties: {_links: {allOf: [{$ref: "#/components/schemas/Links"}, {required: [self]}]}}
    SessionItem:
      anyOf:
        -
          allOf:
            - {$ref: "#/components/schemas/LegacySession"}
            -
              type: object
              properties:
                project: {$ref: "#/components/schemas/NullableProjectDetail"}
                messages: {type: array, items: {$ref: "#/components/schemas/MessageDetail"}}
                messagesPage: {$ref: "#/components/schemas/Page"}
                tasks: {type: array, items: {$ref: "#/components/schemas/TaskDetail"}}
                tasksPage: {$ref: "#/components/schemas/Page"}
        -
          $ref: "#/components/schemas/SessionProjectRelation"
          type: object
          required: [id, projectId, title, status, createdAt, _links]
          properties:
            id: {type: string, minLength: 1}
            projectId: {type: [string, "null"], minLength: 1}
            title: {type: string, minLength: 1, maxLength: 10000}
            status: {type: string, enum: [active, completed, archived]}
            createdAt: {type: string, format: date-time}
            project: {$ref: "#/components/schemas/NullableProjectDetail"}
            messages: {type: array, items: {$ref: "#/components/schemas/MessageDetail"}}
            messagesPage: {$ref: "#/components/schemas/Page"}
            tasks: {type: array, items: {$ref: "#/components/schemas/TaskDetail"}}
            tasksPage: {$ref: "#/components/schemas/Page"}
            _links: {allOf: [{$ref: "#/components/schemas/Links"}, {required: [self]}]}
          additionalProperties: false
    ProjectPage:
      type: object
      required: [items, page, links, _links]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/ProjectItem"}}
        page: {$ref: "#/components/schemas/Page"}
        links: {$ref: "#/components/schemas/PageLinks"}
        _links: {allOf: [{$ref: "#/components/schemas/Links"}, {required: [self]}]}
    SessionPage:
      type: object
      required: [items, page, links, _links]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/SessionItem"}}
        page: {$ref: "#/components/schemas/Page"}
        links: {$ref: "#/components/schemas/PageLinks"}
        _links: {allOf: [{$ref: "#/components/schemas/Links"}, {required: [self]}]}
    MessagePage:
      type: object
      required: [items, page, links, _links]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/MessageItem"}}
        page: {$ref: "#/components/schemas/Page"}
        links: {$ref: "#/components/schemas/PageLinks"}
        _links: {allOf: [{$ref: "#/components/schemas/Links"}, {required: [self]}]}
    TaskPage:
      type: object
      required: [items, page, links, _links]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/TaskItem"}}
        page: {$ref: "#/components/schemas/Page"}
        links: {$ref: "#/components/schemas/PageLinks"}
        _links: {allOf: [{$ref: "#/components/schemas/Links"}, {required: [self]}]}
    SessionsResult:
      oneOf:
        - {type: array, items: {$ref: "#/components/schemas/LegacySession"}}
        - {$ref: "#/components/schemas/SessionPage"}
    Member:
      type: object
      required: [userId, role, _links]
      properties:
        userId: {type: string, minLength: 1}
        role: {type: string, enum: [member, viewer]}
        _links: {allOf: [{$ref: "#/components/schemas/Links"}, {required: [delete]}]}
    Members:
      type: object
      required: [items, _links]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Member"}}
        _links: {allOf: [{$ref: "#/components/schemas/Links"}, {required: [setMember]}]}
    SetMember:
      type: object
      required: [userId, role]
      properties: {userId: {type: string, minLength: 1}, role: {type: string, enum: [member, viewer]}}
      additionalProperties: false
    CreateProject:
      type: object
      required: [name]
      properties:
        id: {type: string, pattern: "^[A-Za-z0-9_-]{1,100}$"}
        name: {type: string, minLength: 1, maxLength: 10000}
        language: {type: [string, "null"]}
        repositoryUrl: {type: [string, "null"]}
        visibility: {type: string, enum: [private, public]}
      additionalProperties: false
    UpdateProject:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 10000}
        language: {type: [string, "null"]}
        repositoryUrl: {type: [string, "null"]}
        visibility: {type: string, enum: [private, public]}
      additionalProperties: false
      minProperties: 1
    CreateSession:
      type: object
      required: [title]
      properties:
        id: {type: string, pattern: "^[A-Za-z0-9_-]{1,100}$"}
        projectId: {type: [string, "null"], minLength: 1, description: "Omit or send null for a private, standalone session."}
        title: {type: string, minLength: 1, maxLength: 10000}
        status: {type: string, enum: [active, completed, archived]}
      additionalProperties: false
    CreateNestedSession:
      type: object
      required: [title]
      properties:
        id: {type: string, pattern: "^[A-Za-z0-9_-]{1,100}$"}
        projectId: {type: string, description: "If supplied, must equal the projectId in the path."}
        title: {type: string, minLength: 1, maxLength: 10000}
        status: {type: string, enum: [active, completed, archived]}
      additionalProperties: false
    UpdateSession:
      type: object
      properties:
        title: {type: string, minLength: 1, maxLength: 10000}
        status: {type: string, enum: [active, completed, archived]}
      additionalProperties: false
      minProperties: 1
    CreateMessage:
      type: object
      required: [role, content]
      properties:
        id: {type: string, pattern: "^[A-Za-z0-9_-]{1,100}$"}
        sessionId: {type: string, description: "If supplied, must equal the sessionId in the path."}
        role: {type: string, enum: [user, assistant, system, tool]}
        content: {type: string, minLength: 1, maxLength: 10000}
      additionalProperties: false
    CreateTask:
      type: object
      required: [title]
      properties:
        id: {type: string, pattern: "^[A-Za-z0-9_-]{1,100}$"}
        sessionId: {type: string, description: "If supplied, must equal the sessionId in the path."}
        title: {type: string, minLength: 1, maxLength: 10000}
        status: {const: pending}
        result: {type: "null", description: "New tasks cannot already have a result."}
      additionalProperties: false
    UpdateTask:
      type: object
      properties:
        title: {type: string, minLength: 1, maxLength: 10000}
        status: {type: string, enum: [pending, running, completed, failed]}
        result: {type: [string, "null"]}
      additionalProperties: false
      minProperties: 1
    GoalInput:
      oneOf:
        - {type: object, required: [goal], properties: {goal: {type: string, minLength: 1, maxLength: 2000}}, additionalProperties: false}
        - {type: object, required: [action], properties: {action: {enum: [pause, resume, done, clear]}}, additionalProperties: false}
    ThreadGoal:
      type: object
      required: [goal, status]
      properties:
        goal: {type: [string, "null"], maxLength: 2000}
        status: {enum: [none, active, paused, done]}
      additionalProperties: false
    AsideInput:
      type: object
      required: [message, provider, model]
      properties:
        message: {type: string, minLength: 1, maxLength: 6000}
        provider: {enum: [openai, anthropic, ollama]}
        model: {type: string, minLength: 1, maxLength: 80}
        replyTo: {type: string, pattern: '^aside_[a-f0-9]{24}$'}
      additionalProperties: false
    AsideHistory:
      type: object
      required: [items]
      properties: {items: {type: array, maxItems: 20, items: {$ref: "#/components/schemas/ThreadAside"}}}
      additionalProperties: false
    ThreadAside:
      type: object
      required: [id, question, answer, provider, model]
      properties:
        id: {type: string, pattern: '^aside_[a-f0-9]{24}$'}
        question: {type: string, minLength: 1, maxLength: 6000}
        answer: {type: string, minLength: 1, maxLength: 10000}
        provider: {enum: [openai, anthropic, ollama]}
        model: {type: string}
      additionalProperties: false
    ChatPermissions:
      type: object
      required: [mode]
      properties:
        mode: {enum: [ask, allow, yolo]}
      additionalProperties: false
    ModelCatalog:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items:
            type: object
            required: [id, label, status, models]
            properties:
              id: {enum: [openai, anthropic, ollama]}
              label: {type: string}
              status: {enum: [available, not_configured, unavailable]}
              models: {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
              truncated: {const: true, description: "Only present when the inventory limit was reached."}
            additionalProperties: false
      additionalProperties: false
    AgentInput:
      type: object
      required: [message, tools]
      properties:
        message: {type: string, minLength: 1, maxLength: 6000}
        tools: {type: boolean}
        provider: {type: string, enum: [openai, anthropic, ollama]}
        model: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.:/-]{0,79}$"}
      additionalProperties: false
    AgentEvent:
      type: object
      required: [name, path, output]
      properties:
        name: {type: string}
        path: {type: string}
        output: {type: string}
        runId: {type: string, pattern: "^run_[a-f0-9]{24}$"}
        _links: {$ref: "#/components/schemas/Links"}
      additionalProperties: false
    AgentRun:
      type: object
      required: [id, sessionId, prompt, provider, model, tools, status, events, error, _links]
      properties:
        id: {type: string, pattern: "^turn_[a-f0-9]{24}$"}
        sessionId: {type: string}
        prompt: {type: string}
        provider: {enum: [openai, anthropic, ollama]}
        model: {type: string}
        tools: {type: boolean}
        status: {enum: [ready, working, review, completed, failed, cancelled]}
        events: {type: array, items: {$ref: "#/components/schemas/AgentEvent"}}
        error: {type: [string, "null"]}
        _links: {$ref: "#/components/schemas/Links"}
      additionalProperties: false
    CurrentAgentRun:
      type: object
      required: [run]
      properties: {run: {oneOf: [{$ref: "#/components/schemas/AgentRun"}, {type: "null"}]}}
      additionalProperties: false
    ChatInput:
      type: object
      required: [message]
      properties:
        message: {type: string, minLength: 1, maxLength: 6000}
        provider: {type: string, enum: [openai, anthropic, ollama]}
        model: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.:/-]{0,79}$"}
      additionalProperties: false
    ChatResult:
      type: object
      required: [sessionId, userMessage, assistantMessage, provider, model]
      properties:
        sessionId: {type: string, minLength: 1}
        userMessage: {$ref: "#/components/schemas/Message"}
        assistantMessage: {$ref: "#/components/schemas/Message"}
        provider: {type: string, enum: [openai, anthropic, ollama]}
        model: {type: string, minLength: 1, maxLength: 10000}
    CredentialInput:
      type: object
      required: [apiKey]
      properties: {apiKey: {type: string, pattern: "^[!-~]{1,4096}$", writeOnly: true}}
      additionalProperties: false
    CredentialStatus:
      type: object
      required: [provider, configured, _links]
      additionalProperties: false
      properties:
        provider: {type: string, enum: [openai, anthropic]}
        configured: {const: true}
        _links: {allOf: [{$ref: "#/components/schemas/Links"}, {required: [runtime, deleteCredential]}]}
    Provider:
      type: object
      required: [id, label, defaultModel, configured, connected, note]
      properties:
        id: {type: string, enum: [openai, anthropic, ollama]}
        label: {type: string, minLength: 1, maxLength: 10000}
        defaultModel: {type: string, minLength: 1, maxLength: 10000}
        configured: {type: boolean}
        connected: {type: boolean}
        note: {type: string}
        _links: {$ref: "#/components/schemas/Links"}
    Runtime:
      type: object
      required: [harness, database, ai, capabilities, _links]
      properties:
        harness: {const: Osiris}
        database: {const: PostgreSQL}
        ai:
          type: object
          required: [defaultProvider, providers, connected, note, _links]
          properties:
            defaultProvider: {type: string, enum: [openai, anthropic, ollama]}
            providers: {type: array, items: {$ref: "#/components/schemas/Provider"}}
            connected: {type: boolean}
            note: {type: string}
            _links: {allOf: [{$ref: "#/components/schemas/Links"}, {required: [budget]}]}
        _links: {allOf: [{$ref: "#/components/schemas/Links"}, {required: [self, service]}]}
        capabilities:
          type: object
          required: [session_chat, database_history, shell_execution, filesystem_access, approved_virtual_workspace, github_composite]
          properties:
            session_chat: {const: true}
            database_history: {const: true}
            shell_execution: {const: false}
            filesystem_access: {const: false}
            approved_virtual_workspace: {const: true}
            github_composite: {const: true}
          additionalProperties: {type: boolean}
    Budget:
      type: object
      required: [day, limit, spent, reserved, remaining, unit, _links]
      properties:
        day: {type: string, format: date}
        limit: {type: integer, minimum: 1}
        spent: {type: integer, minimum: 0}
        reserved: {type: integer, minimum: 0}
        remaining: {type: integer, minimum: 0}
        unit: {const: provider_dispatch}
        _links: {allOf: [{$ref: "#/components/schemas/Links"}, {required: [self]}]}
    WorkspaceName: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$"}
    RequestTool:
      oneOf:
        -
          type: object
          required: [operation, path]
          properties: {operation: {const: workspace.read}, path: {$ref: "#/components/schemas/WorkspaceName"}}
          additionalProperties: false
        -
          type: object
          required: [operation, path, content]
          properties:
            operation: {const: workspace.write}
            path: {$ref: "#/components/schemas/WorkspaceName"}
            content: {type: string, maxLength: 8192, description: "Maximum 8192 UTF-8 bytes."}
          additionalProperties: false
    Empty: {type: object, properties: {}, additionalProperties: false}
    ToolRun:
      type: object
      required:
        - id
        - sessionId
        - operation
        - path
        - content
        - status
        - version
        - requestedBy
        - approvedBy
        - executedBy
        - createdAt
        - approvedAt
        - executedAt
        - result
        - _links
      properties:
        id: {type: string, minLength: 1}
        sessionId: {type: string, minLength: 1}
        operation: {type: string, enum: [workspace.write, workspace.read]}
        path: {$ref: "#/components/schemas/WorkspaceName"}
        content: {type: [string, "null"]}
        status: {type: string, enum: [requested, approved, completed]}
        version: {type: integer, minimum: 1}
        requestedBy: {type: string, minLength: 1}
        approvedBy: {type: [string, "null"]}
        executedBy: {type: [string, "null"]}
        createdAt: {type: string, format: date-time}
        approvedAt: {type: [string, "null"], format: date-time}
        executedAt: {type: [string, "null"], format: date-time}
        result: {type: [string, "null"]}
        _links: {allOf: [{$ref: "#/components/schemas/Links"}, {required: [self]}]}
      allOf:
        - if: {properties: {operation: {const: workspace.read}}}
          then: {properties: {content: {type: "null"}}}
          else: {properties: {content: {type: string}}}
        - if: {properties: {status: {const: requested}}}
          then: {properties: {approvedBy: {type: "null"}, approvedAt: {type: "null"}}}
          else: {properties: {approvedBy: {type: string}, approvedAt: {type: string}}}
        - if: {properties: {status: {const: completed}}}
          then: {properties: {executedBy: {type: string}, executedAt: {type: string}, result: {type: string}}}
          else: {properties: {executedBy: {type: "null"}, executedAt: {type: "null"}, result: {type: "null"}}}
    ToolRunPage:
      type: object
      required: [items, page, links, _links]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/ToolRun"}}
        page: {$ref: "#/components/schemas/Page"}
        links: {$ref: "#/components/schemas/PageLinks"}
        _links: {allOf: [{$ref: "#/components/schemas/Links"}, {required: [self]}]}
    Repository:
      type: object
      required: [fullName, url, description, defaultBranch, stargazersCount, openIssuesCount]
      properties:
        fullName: {type: string, minLength: 1, maxLength: 10000}
        url: {type: string, format: uri}
        description: {type: [string, "null"]}
        defaultBranch: {type: [string, "null"]}
        stargazersCount: {type: integer, minimum: 0}
        openIssuesCount: {type: integer, minimum: 0}
    External:
      type: object
      required: [source, status, provenance, repository]
      properties:
        source: {type: string, minLength: 1, maxLength: 10000}
        status: {type: string, enum: [ok, not_configured, unavailable]}
        provenance: {type: string, enum: [live, fixture, none]}
        reason: {type: string, minLength: 1, maxLength: 10000}
        repository: {anyOf: [{$ref: "#/components/schemas/Repository"}, {type: "null"}]}
      allOf:
        -
          if: {properties: {status: {const: ok}}}
          then: {properties: {repository: {$ref: "#/components/schemas/Repository"}}}
          else: {properties: {repository: {type: "null"}}}
        - {if: {properties: {status: {const: unavailable}}}, then: {required: [reason]}}
    Context:
      type: object
      required: [session, project, messages, tasks, sources, external, _links]
      properties:
        _links: {allOf: [{$ref: "#/components/schemas/Links"}, {required: [self, session]}]}
        session: {$ref: "#/components/schemas/SessionDetail"}
        project: {$ref: "#/components/schemas/NullableProjectDetail"}
        messages:
          type: object
          required: [items, page, _links]
          properties:
            _links: {allOf: [{$ref: "#/components/schemas/Links"}, {required: [collection]}]}
            items: {type: array, items: {$ref: "#/components/schemas/MessageDetail"}}
            page: {$ref: "#/components/schemas/Page"}
        tasks:
          type: object
          required: [items, page, _links]
          properties:
            _links: {allOf: [{$ref: "#/components/schemas/Links"}, {required: [collection]}]}
            items: {type: array, items: {$ref: "#/components/schemas/TaskDetail"}}
            page: {$ref: "#/components/schemas/Page"}
        sources:
          type: object
          required: [local, external]
          properties: {local: {const: PostgreSQL}, external: {type: string, minLength: 1, maxLength: 10000}}
        external: {$ref: "#/components/schemas/External"}
    NullableProjectDetail:
      anyOf: [{$ref: "#/components/schemas/ProjectDetail"}, {type: "null"}]
    ProjectDetail:
      allOf:
        - {$ref: "#/components/schemas/Project"}
        -
          type: object
          required: [_links]
          properties: {_links: {allOf: [{$ref: "#/components/schemas/Links"}, {required: [self]}]}}
    SessionDetail:
      allOf:
        - {$ref: "#/components/schemas/Session"}
        -
          type: object
          required: [_links]
          properties: {_links: {allOf: [{$ref: "#/components/schemas/Links"}, {required: [self]}]}}
    MessageDetail:
      allOf:
        - {$ref: "#/components/schemas/Message"}
        -
          type: object
          required: [_links]
          properties: {_links: {allOf: [{$ref: "#/components/schemas/Links"}, {required: [self]}]}}
    TaskDetail:
      allOf:
        - {$ref: "#/components/schemas/Task"}
        -
          type: object
          required: [_links]
          properties: {_links: {allOf: [{$ref: "#/components/schemas/Links"}, {required: [self]}]}}
    Links:
      description: "Relation names are keys. Methods, targets and permissions come from the server. Follow only site-relative href values. Next/previous and unavailable mutations are omitted rather than advertised."
      type: object
      properties:
        self: {allOf: [{$ref: "#/components/schemas/Link"}, {properties: {method: {const: GET}}}]}
