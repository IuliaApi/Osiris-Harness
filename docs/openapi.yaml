  /sessions/{sessionId}/context:
    parameters: [{$ref: "#/components/parameters/sessionId"}]
    get:
      operationId: getSessionExternalContext
      description: "Return PostgreSQL data even if the allowlisted GitHub repository is unavailable. A private session without a project returns project: null. Inspect external.status, reason and provenance. Fixture scenarios are controlled by server configuration; this endpoint accepts no query."
      responses:
        "200": {$ref: "#/components/responses/Context"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "406": {$ref: "#/components/responses/NotAcceptable"}
        "500": {$ref: "#/components/responses/Error"}
  /sessions/{sessionId}/tool-runs:
