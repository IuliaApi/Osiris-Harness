    parameters: [{$ref: "#/components/parameters/sessionId"}, {$ref: "#/components/parameters/runId"}]
    post:
      operationId: executeToolRun
      description: "Execute one approved operation transactionally in the database workspace. Missing input returns 409 and leaves the operation approved and retryable."
      security: [{sessionCookie: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/ifMatch"}]
      requestBody: {$ref: "#/components/requestBodies/Empty"}
      responses:
        "200": {$ref: "#/components/responses/ToolRun"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "406": {$ref: "#/components/responses/NotAcceptable"}
        "409": {$ref: "#/components/responses/Error"}
        "412": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "415": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "428": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: osiris_session
      description: "Opaque HttpOnly server-side session obtained from POST /auth/login."
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: "Current csrfToken from login or /auth/me. Required together with the session cookie on every authenticated mutation, including logout."
  parameters:
    projectId: {name: projectId, in: path, required: true, schema: {type: string, minLength: 1}}
    sessionId: {name: sessionId, in: path, required: true, schema: {type: string, minLength: 1}}
    messageId: {name: messageId, in: path, required: true, schema: {type: string, minLength: 1}}
    taskId: {name: taskId, in: path, required: true, schema: {type: string, minLength: 1}}
    userId: {name: userId, in: path, required: true, schema: {type: string, minLength: 1}}
    turnId: {name: turnId, in: path, required: true, schema: {type: string, pattern: "^turn_[a-f0-9]{24}$"}}
    runId: {name: runId, in: path, required: true, schema: {type: string, minLength: 1}}
    provider: {name: provider, in: path, required: true, schema: {type: string, enum: [openai, anthropic]}}
    ifMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string, pattern: "^\"[1-9][0-9]*\"$"}
      description: "Strong quoted version from the resource, e.g. \"1\". Missing: 428; stale: 412."
    limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    offset:
      name: offset
      in: query
      required: false
      schema: {type: integer, minimum: 0, maximum: 1000000, default: 0}
    order:
      name: order
      in: query
      required: false
      schema: {type: string, enum: [asc, desc]}
      description: "Default asc, with id as a stable tie breaker."
    view:
      name: view
      in: query
      required: false
      schema: {type: string, enum: [full, summary]}
      description: "Default full. Summary omits large and secondary fields."
    include:
      name: include
      in: query
      required: false
      schema: {type: string}
      description: "Comma-separated project,messages,tasks with no repetitions; embeds children with their page counts."
    q: {name: q, in: query, required: false, schema: {type: string, minLength: 1, maxLength: 200}}
    deleteContents:
      name: deleteContents
      in: query
      required: false
      schema: {const: "1"}
      description: "Atomically delete children before deleting the session. Without it, dependencies result in 409."
  requestBodies:
    LoginInput:
      required: true
      content:
        application/json: {schema: {$ref: "#/components/schemas/LoginInput"}}
        application/xml: {schema: {$ref: "#/components/schemas/LoginInput"}}
        text/xml: {schema: {$ref: "#/components/schemas/LoginInput"}}
        application/yaml: {schema: {$ref: "#/components/schemas/LoginInput"}}
        text/yaml: {schema: {$ref: "#/components/schemas/LoginInput"}}
    RegisterInput:
      required: true
      content:
        application/json: {schema: {$ref: "#/components/schemas/RegisterInput"}}
        application/xml: {schema: {$ref: "#/components/schemas/RegisterInput"}}
