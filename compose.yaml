name: osiris-harness-dev
services:
  api:
    image: osiris-harness-api:dev
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://osiris_app@db:5432/${OSIRIS_DATABASE_NAME:-osiris_dev}
      OSIRIS_AI_ROUTER: "1"
      OSIRIS_AI_ROUTER_KEY_FILE: /run/osiris/router.key
      OSIRIS_DB_PASSWORD_FILE: /run/osiris/db.key
      OSIRIS_GITHUB_MODE: ${OSIRIS_GITHUB_MODE:-online}
      OSIRIS_VAULT_KEY_FILE: /run/osiris/vault.key
      OSIRIS_DAILY_CHAT_LIMIT: ${OSIRIS_DAILY_CHAT_LIMIT:-20}
      OSIRIS_OPENAI_MODEL: ${OSIRIS_OPENAI_MODEL:-gpt-4.1-mini}
      OSIRIS_ANTHROPIC_MODEL: ${OSIRIS_ANTHROPIC_MODEL:-claude-haiku-4-5}
      OSIRIS_OLLAMA_MODEL: ${OSIRIS_OLLAMA_MODEL:-llama3.2}
      OSIRIS_OLLAMA_ENABLED: ${OSIRIS_OLLAMA_ENABLED:-1}
    volumes:
      - type: bind
        source: ./.local/router.key
        target: /run/osiris/router.key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.local/vault.key
        target: /run/osiris/vault.key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.local/db.key
        target: /run/osiris/db.key
        read_only: true
        bind:
          create_host_path: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${OSIRIS_PORT:-8080}:8080"
    depends_on:
      ai-router:
        condition: service_healthy
      db:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 50
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=8m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      options: {max-size: "5m", max-file: "3"}
    healthcheck:
      test: ["CMD", "php", "-r", "exit(str_contains((string) @file_get_contents('http://127.0.0.1:8080/login'), 'Osiris') ? 0 : 1);"]
      interval: 10s
      start_period: 3s
      timeout: 3s
      retries: 3
  ai-router:
    image: osiris-ai-router:dev
    build:
      context: .
      dockerfile: ai-router/Dockerfile
    environment:
      OSIRIS_AI_ROUTER_KEY_FILE: /run/osiris/router.key
    volumes:
      - type: bind
        source: ./.local/router.key
        target: /run/osiris/router.key
        read_only: true
        bind:
          create_host_path: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 512m
    cpus: 1
    pids_limit: 100
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      options: {max-size: "5m", max-file: "3"}
    healthcheck:
      test: ["CMD", "bun", "-e", "process.exit((await fetch('http://127.0.0.1:8090/health')).ok ? 0 : 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
  adminer:
    profiles: [tools]
    image: adminer:5-standalone@sha256:e3a6b4942dd088a29cc8bbce22553429247c5c2b30b07d856ae49012b5c84a5b
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:8083:8080"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 50
    init: true
  db:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: osiris_dev
      POSTGRES_USER: osiris_dev
      POSTGRES_PASSWORD: osiris_dev_local_only
    ports:
      - "127.0.0.1:55438:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U osiris_dev -d osiris_dev"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
